[project]
name = "apresentacoes"
version = "0.1.0"
description = "Apresentações pessoais"
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
    "mkslides>=2.0.15",
    "taskipy>=1.14.1",
    "ghp-import>=2.1.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
build = "mkslides build"
serve = "mkslides serve"
gh-pages = "ghp-import -p -o -f site/"
list = "task --list"